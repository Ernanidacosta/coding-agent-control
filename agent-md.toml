# Verification and state policy for the coding-agent-control repository.
# The filename remains a compatibility interface.

[verify]
lint = "shellcheck .claude/hooks/*.sh .codex/hooks/*.sh .agent-md/bin/*.sh examples/github-actions/*.sh examples/local-issuer/agent-md-authority .githooks/pre-commit .githooks/commit-msg install.sh"
test = "bash tests/run.sh"
smoke = "bash tests/smoke.sh"
independent = "./examples/github-actions/github-actions-independent.sh"

[verify.policy]
required = ["lint", "test"]
timeout_seconds = 360
total_timeout_seconds = 540

[verify.attestation]
independent_files = [
  "examples/github-actions/github-actions-independent.conf",
  ".github/workflows/ci.yml",
]
independent_capabilities = ["gh"]

[state]
source_globs = [
  ".agent-md/bin/**",
  ".claude/hooks/**",
  ".codex/hooks/**",
  ".githooks/**",
  "examples/**",
  "install.sh",
  "tests/**",
]
ignore_globs = [
  ".agent/**",
  ".github/**",
  ".ai-memory.toml",
  ".gitignore",
  "agent-md.toml",
  "agent-md.toml.example",
  "memory/**",
  "*.md",
]

[integrations.icm]
enabled = true
