name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        # The project already declares what it lints. Reading the contract here
        # keeps CI from drifting away from it, which is how the local issuer
        # ended up unlinted in CI while agent-md.toml covered it.
        run: |
          LINT=$(sed -n 's/^lint = "\(.*\)"$/\1/p' agent-md.toml)
          test -n "$LINT"
          echo "$LINT"
          eval "$LINT"

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON and synced aliases
        run: |
          python3 -m json.tool .claude/settings.json >/dev/null
          python3 -m json.tool .codex/hooks.json >/dev/null
          cmp AGENT.md CLAUDE.md
          ! git grep -n -E 'Archimedes|Aider|claude-md|CONVENTIONS|cursorrules|windsurfrules|CRISPY' -- . ':!.github/workflows/ci.yml'

  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: |
          sudo apt-get update && sudo apt-get install -y bats jq parallel bubblewrap acl apparmor apparmor-profiles
          # GNU parallel refuses to run unattended until its citation notice is
          # acknowledged; without this the suite runner can stall in CI.
          mkdir -p ~/.parallel && touch ~/.parallel/will-cite
      - name: Prepare host security prerequisites
        run: |
          for path in /usr /usr/share /usr/share/ca-certificates /etc /etc/ssl /etc/ssl/certs; do
            stat -c 'before: %a %U:%G %n' "$path"
            getfacl -cp "$path"
          done
          # The image may give the runner ownership of system CA paths.
          sudo chown root:root /usr /usr/share /etc
          sudo chown -R root:root /usr/share/ca-certificates /etc/ssl
          sudo chmod go-w /usr /usr/share /etc
          sudo chmod -R go-w /usr/share/ca-certificates /etc/ssl
          for path in /usr /usr/share /usr/share/ca-certificates /etc /etc/ssl /etc/ssl/certs; do
            stat -c 'after: %a %U:%G %n' "$path"
            getfacl -cp "$path"
          done
          source examples/local-issuer/authority-lib.sh
          trust_probe=$(mktemp -d)
          trap 'chmod -R u+w "$trust_probe"; rm -rf "$trust_probe"' EXIT
          if ! reason=$(authority_materialize_system_trust "$trust_probe/view" / "$(id -u)" "$(id -u)"); then
            echo "system trust prerequisite failed: $reason" >&2
            exit 1
          fi
          # Ubuntu's restricted profile permits bwrap to set up the namespace
          # while denying capabilities to processes inside it.
          test -f /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          bash examples/local-issuer/agent-md-authority doctor --root /tmp/agent-md-ci-authority
      - name: Run bats suite
        run: bash tests/run.sh

  install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dry-run installer
        run: |
          mkdir /tmp/target && cd /tmp/target && git init -q
          bash "$GITHUB_WORKSPACE/install.sh" --dry-run .
      - name: Real install
        run: |
          mkdir /tmp/real && cd /tmp/real && git init -q
          bash "$GITHUB_WORKSPACE/install.sh" --no-githooks .
          # Core artifacts must exist
          test -f AGENT.md
          test -f CLAUDE.md
          test -f AGENTS.md
          test -f .cursor/rules/agent-md.mdc
          test -f .windsurf/rules/agent-md.md
          test -f .claude/settings.json
          test -f .claude/hooks/_lib.sh
          test -f .codex/hooks.json
          test -f .codex/hooks/stop.sh
          test -f .agents/skills/agent-md-verify/SKILL.md
          test -f .agents/skills/visual-evidence/SKILL.md
          test -f .agent-md/bin/discover_helpers.sh
          test -f .agent-md/bin/doctor.sh
          test -f .agent-md/bin/playwright-capture.sh
          test -f .agent-md/bin/verify.sh
          test -f .githooks/pre-commit
          test -f memory/progress.md
          grep -q '^\.agent/$' .gitignore
          # githooks must NOT be auto-activated
          [ "$(git config --get core.hooksPath || true)" = "" ]
